source: live HTTP probes of predikdata.com, api.predikdata.com and docs.predikdata.com
summary: |
  PREDIK serves no /.well-known/ discovery document on any host. Every canonical
  path on the website host returns the WordPress 404 page (a real 404, not a
  soft-200 shell), and every path on the API host returns the AWS API Gateway
  "Missing Authentication Token" 403. No WellKnown pointer is emitted, because
  no probed path returned a 200 carrying a real document.

  Two real, provider-published documents WERE found outside /.well-known/ and are
  saved verbatim in this repo: llms.txt (see llms/predikt-ai-llms.txt) and a
  robots.txt carrying Cloudflare-managed Content-Signal directives (saved here as
  predikt-ai-robots.txt).

hosts:
- host: predikdata.com
  role: website
  note: WordPress behind Cloudflare; the site root and most HTML paths answer a
    Cloudflare "Just a moment..." bot-challenge interstitial (403) to non-browser
    clients. Static text files (robots.txt, llms.txt) are served normally.
- host: api.predikdata.com
  role: api
  note: >-
    Live AWS API Gateway custom domain (CNAME d-gstj9ww92b.execute-api.us-east-1.amazonaws.com),
    TLS cert CN=*.predikdata.com issued by Amazon RSA 2048 M01 — PREDIK-controlled.
    Every path returns the API Gateway 403 {"message":"Missing Authentication Token"}
    EXCEPT /ping, which returns 200 "Healthy Connection". The host is a real,
    operating API; its routes and contract are entirely auth-gated and undocumented.
- host: docs.predikdata.com
  role: asset host
  note: S3 origin behind Cloudflare. Returns S3 <Error>AccessDenied</Error> for
    object paths and a Cloudflare challenge at the root. Not a developer docs site;
    no spec was reachable.

