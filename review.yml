  apisYmlUpdated: true
  reason: |
    No WebSocket surface exists, and PREDIK exposes no documented public self-serve
    API at all - it is a contact-sales data-licensing provider. No AsyncAPI or
    OpenAPI document was created because there is no public, documented API surface
    to model. The entry honestly records the delivery channels PREDIK advertises
    (REST/SOAP/Feed API, S3) and marks endpoints as not modeled.
