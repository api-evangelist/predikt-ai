  description: Partner-delivered, contact-sales data API that serves PREDIK's enriched
    location-intelligence products - POI data, aggregated foot-traffic and mobility
    data, company and commercial-area intelligence, and socio-demographic enrichment.
    PREDIK lists REST API, SOAP API, and Feed API (alongside S3-bucket) as delivery
    channels, with output in JSON, CSV, or SQL. Access, schema, and coverage are
    negotiated per engagement. The API host itself was verified live on 2026-08-14
    - https://api.predikdata.com is an AWS API Gateway custom domain on PREDIK's own
    domain (TLS cert CN=*.predikdata.com issued by Amazon), and its /ping endpoint
    returns HTTP 200 "Healthy Connection". Every other probed path returns the API
    Gateway 403 {"message":"Missing Authentication Token"}, so the routes and the
    contract are entirely credentialed. No public developer portal, API reference,
    authentication documentation, or machine-readable specification is published
    anywhere, and the provider's own llms.txt (a complete inventory of every page on
    predikdata.com) lists no developer or documentation page at all. Endpoints are
    therefore not modeled (endpointsModeled=false) - the host is real and reachable,
    but nothing about its surface is publicly described.
