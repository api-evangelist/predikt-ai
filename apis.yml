name: PREDIK Data-Driven
kind: company
description: PREDIK Data-Driven is a big-data analytics and location-intelligence
  research firm (founded 2008, Coral Gables, Florida) that builds enriched geospatial
  datasets for site selection, demand forecasting, and web/reference intelligence.
  Its products cover Point-of-Interest (POI) data, aggregated foot-traffic and human
  mobility data derived from anonymized mobile devices, company and commercial-area
  intelligence, and socio-demographic enrichment - divided into geohash-7 (150x150m)
  cells with 100-200+ variables and coverage of up to 96 countries. PREDIK is a
  data-delivery / contact-sales provider - datasets are licensed and delivered as
  managed feeds via REST API, SOAP API, Feed API, or S3 bucket in JSON, CSV, and SQL
  formats. There is no public self-serve developer API portal or published API
  reference; access is arranged directly with PREDIK or through the Datarade
  marketplace. Endpoints are not publicly documented and are therefore not modeled
  here.
