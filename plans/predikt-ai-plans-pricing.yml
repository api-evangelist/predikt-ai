coverageNotes: |
  Coverage advertised up to 96 countries for the enriched mobile-location dataset
  (~5M records/devices, ~4 years of history, ESG-compliant sourcing). Regional
  POI + foot-traffic products carry 100-200+ variables per market and are divided
  into geohash-7 (~150x150 m) cells. Aggregated foot-traffic products list ~12
  countries (e.g. USA, Mexico, Colombia, Ecuador, Dominican Republic).
