summary: |
  PREDIK Data-Driven does not publish self-serve or list-priced API plans. It is a
  data-licensing / contact-sales provider - datasets and their delivery APIs are
  scoped, quoted, and licensed per engagement based on geography, dataset, variable
  set, history depth, refresh cadence, and delivery method. Custom pricing,
  subscription fees, and quotes are obtained directly from PREDIK or through the
  Datarade marketplace. The offering is positioned for mid-market and enterprise
  buyers.

  Re-verified 2026-08-14: the provider's own llms.txt (HTTP 200) enumerates every
  page on predikdata.com and lists no pricing, plans, or developer page. There are
  zero published plans (plan_count: 0) — the only commercial entry points are the
  contact and demo-request forms and the Datarade marketplace listing.
